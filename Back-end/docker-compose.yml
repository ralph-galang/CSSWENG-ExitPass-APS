services:
  postgres:
    image: postgres:16
    container_name: exitpass-mops-local-db
    environment:
      POSTGRES_DB: exitpass_mops_local
      POSTGRES_USER: exitpass
      POSTGRES_PASSWORD: exitpass_local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - exitpass_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exitpass -d exitpass_mops_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  exitpass_pg_data:
